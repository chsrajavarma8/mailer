[smtp]
; Gmail: smtp.gmail.com / 587. Outlook: smtp.office365.com / 587
host = smtp.gmail.com
port = 587
; Your full email address
username = you@example.com
; Gmail needs a 16-character App Password, NOT your normal password.
; Create one at https://myaccount.google.com/apppasswords (2-Step Verification must be on).
; Leave blank and set it in the dashboard (it is encrypted there), or use the MAIL_PASSWORD environment variable.
password =

[sender]
from_name = Your Name
from_email = you@example.com

[options]
; Seconds to wait between emails (avoids being rate-limited / flagged as spam)
delay_seconds = 2.0
