[smtp]
; Gmail: smtp.gmail.com / 587. Outlook: smtp.office365.com / 587
host = smtp.gmail.com
port = 587
; Your full email address
username = you@example.com
; Gmail needs a 16-character App Password, NOT your normal password.
; Create one at https://myaccount.google.com/apppasswords (2-Step Verification must be on).
; Leave blank and set it in the dashboard (it is encrypted there), or use the MAIL_PASSWORD environment variable.
password =

[sender]
from_name = Your Name
from_email = you@example.com
; Optional: where replies go (defaults to from_email)
reply_to =

[options]
; Seconds to wait between emails (avoids being rate-limited / flagged as spam)
delay_seconds = 2.0
; Temporary errors (server busy, connection dropped) are retried this many times.
; Permanent errors such as a non-existent address are never retried.
max_retries = 3
; Wait before the first retry; it doubles on each further try (5, 10, 20 ...)
retry_delay_seconds = 5
; Stop once this many emails were sent in the last 24 hours (0 = no limit).
; Gmail allows about 500 a day, Google Workspace about 2000.
daily_limit = 500
